# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://tera.readthedocs.io/en/latest/#templates
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking -%}<span class="breaking">[**breaking**]</span> {% endif -%}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.committer.name }}))
    {% endfor %}
{% endfor %}\n
"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# postprocessors
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/storious/GES-GSP-Plus" }, 
]

[git]
repo_url = "https://github.com/storious/GES-GSP-Plus"
link_commits = true
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# regex for parsing the group part of a commit message
group_parsers = [
    { pattern = "^feat", group = "✨ Features | 新功能" },
    { pattern = "^fix", group = "🐛 Bug Fixes | 修复" },
    { pattern = "^doc", group = "📝 Documentation | 文档" },
    { pattern = "^style", group = "💄 Styling | 样式" },
    { pattern = "^refactor", group = "♻️ Code Refactoring | 重构" },
    { pattern = "^perf", group = "⚡ Performance | 性能优化" },
    { pattern = "^test", group = "✅ Tests | 测试" },
    { pattern = "^build", group = "📦 Build | 构建" },
    { pattern = "^ci", group = "🔧 Continuous Integration | CI配置" },
    { pattern = "^chore", group = "🧹 Chores | 杂项" },

]
# protect certain branches from being rewritten
protect_branches = true
# filter out the commits that are not matched by any group parser
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# regex for skipping tags
skip_tags = ""
# regex for ignoring tags
ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
